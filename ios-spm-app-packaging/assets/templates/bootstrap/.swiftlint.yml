opt_in_rules:
  - empty_count
  - explicit_init
  - sorted_imports
  - redundant_nil_coalescing
  - private_outlet
  - overridden_super_call
  - prohibited_super_call

disabled_rules:
  - trailing_whitespace

analyzer_rules:
  - explicit_self
  - unused_import

included:
  - Sources

excluded:
  - .build
  - build
  - DerivedData
  - Pods

force_cast: warning
force_try: error
line_length:
  warning: 120
  error: 150
type_body_length:
  warning: 300
  error: 500
file_length:
  warning: 500
  error: 1000
function_body_length:
  warning: 40
  error: 100

reporter: "xcode"
